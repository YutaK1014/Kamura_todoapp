<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <section class="experience-card" aria-label="経験値">
            <div class="experience-header">
                <div class="rank-info">
                    <div>
                        <div class="rank-name" th:text="${experienceRank}">Platinum</div>
                        <div class="rank-caption">現在のティア</div>
                    </div>
                </div>
                <div class="points-info">
                    <div class="points-total"><span th:text="${experiencePoints}">601</span> <small>pt</small></div>
                    <div class="points-caption">通期ポイント</div>
                </div>
                    <div class="points-caption">通期ポイント</div>
                </div>
            </div>
            <div class="experience-labels">
                <span th:text="${experienceRank}">Platinum</span>
                <span th:text="${nextExperienceRank + ' (' + nextExperience + 'pt)'}">Diamond (800pt)</span>
            </div>
            <div class="experience-bar" style="display:block;width:100%;height:14px;min-height:14px;background:#475569;border-radius:999px;overflow:hidden;" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                 th:aria-valuenow="${experienceProgress}">
                <span style="display:block;height:100%;background:#22d3ee;border-radius:999px;" th:style="'width: ' + ${experienceProgress} + '%;display:block;height:100%;background:#22d3ee;border-radius:999px'" aria-hidden="true"></span>
            </div>
            <div class="experience-progress-text" th:text="${experienceProgress + '% 達成'}">0% 達成</div>
            <div class="experience-remaining" th:text="${experienceRemaining > 0 ? 'あと ' + experienceRemaining + 'pt' : '最高ランク'}">あと 199pt</div>
        </section>
        <h1 class="page-title">ToDo一覧</h1>

        <p class="flash" th:if="${message != null}" th:text="${message}"></p>
        <p id="today-weather" aria-live="polite"></p>

        <p class="page-actions"><a class="btn" href="/todos/new">新規登録</a> <a class="btn" href="/calendar">カレンダーで見る</a></p>

        <p class="page-actions"><a class="btn sub" th:href="@{/todos(trash=1)}">削除済みを見る</a></p>

        <form class="search-bar" method="get" action="/todos">
            <label>やること
                <input class="form-input" type="text" name="keyword" th:value="${keyword}">
            </label>
            <label>ジャンル
                <select class="form-input" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </label>
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="trash" th:value="${trash}">
            <label>
                <input type="checkbox" name="showCompleted" value="true" th:checked="${showCompleted}" onchange="this.form.submit()">
                完了したものも表示する
            </label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', showCompleted=${showCompleted})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', showCompleted=${showCompleted})}">期限が遠い順</a>
            <a class="link" th:href="@{/api/todos.csv(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted}, trash=${trash})}">CSVで書き出す</a>
        </form>

        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(T(java.time.LocalDate).now()) and todo.completed == false ? ' overdue' : ''}">
                    <td>
                        <span th:if="${todo.pinned == true}" aria-label="ブックマーク">🔖 </span>
                        <span th:text="${todo.title}">やること</span>
                    </td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span>
                        <span class="priority-mark" th:if="${todo.priority == 1}" aria-hidden="true">★</span>
                    </td>
                    <td th:text="${todo.dueDate}">期限</td>
                    <td>
                        <span th:text="${todo.completed == true ? '完了' : '未完了'}">状態</span>
                        <span th:if="${todo.completedAt != null}" th:text="${' (' + todo.completedAt + ')'}"></span>
                    </td>
                    <td>
                        <form th:if="${trash != 1}" th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <input type="hidden" name="category" th:value="${category}">
                            <input type="hidden" name="order" th:value="${order}">
                            <input type="hidden" name="showCompleted" th:value="${showCompleted}">
                            <input type="hidden" name="trash" th:value="${trash}">
                            <input type="hidden" name="page" th:value="${page}">
                            <button class="btn sub" type="submit" th:text="${todo.pinned == true ? '印を外す' : '印を付ける'}">印を付ける</button>
                        </form>
                        <th:block th:if="${trash == 1}">
                            <form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                                <button class="btn sub" type="submit">戻す</button>
                            </form>
                        </th:block>
                        <th:block th:unless="${trash == 1}">
                            <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                            <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
                        </th:block>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav class="pagination" th:if="${totalPages > 1}" aria-label="page navigation">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted}, trash=${trash}, page=${pageNumber})}"
               th:text="${pageNumber}"
               th:classappend="${pageNumber == page ? ' current' : ''}">1</a>
        </nav>
    </main>
    <script>
        async function loadTodayWeather() {
            const weatherElement = document.querySelector('#today-weather');
            try {
                const response = await fetch('/api/weather');
                const weather = await response.json();
                if (!response.ok || response.headers.has('X-Weather-Unavailable')
                        || weather.temperature === undefined) {
                    return;
                }
                weatherElement.textContent = `今日の天気（東京）：${weather.description}、${weather.temperature}℃`;
            } catch (error) {
                // 天気が取れなくても、Todo一覧の表示は続ける。
            }
        }

        loadTodayWeather();
    </script>
</body>
</html>
