<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo登録確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title">ToDo登録確認</h1>

        <div class="form-row">
            <p class="form-label">やること</p>
            <p th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}">やること</p>
        </div>

        <div class="form-row">
            <p class="form-label">メモ</p>
            <p th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}">メモ</p>
        </div>

        <div class="form-row">
            <p class="form-label">ジャンル</p>
            <p th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}">ジャンル</p>
        </div>

        <div class="form-row">
            <p class="form-label">優先度</p>
            <p th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}">優先度</p>
        </div>

        <div class="form-row">
            <p class="form-label">期限</p>
            <p th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">期限</p>
        </div>

        <form th:action="@{/todos}" method="post">
            <input type="hidden" name="title" th:value="${todo.title}">
            <input type="hidden" name="detail" th:value="${todo.detail}">
            <input type="hidden" name="category" th:value="${todo.category}">
            <input type="hidden" name="priority" th:value="${todo.priority}">
            <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
            <button class="btn" type="submit">登録する</button>
        </form>

        <form th:action="@{/todos/new}" method="post">
            <input type="hidden" name="title" th:value="${todo.title}">
            <input type="hidden" name="detail" th:value="${todo.detail}">
            <input type="hidden" name="category" th:value="${todo.category}">
            <input type="hidden" name="priority" th:value="${todo.priority}">
            <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
            <button class="btn sub" type="submit">書き直す</button>
        </form>
    </main>
</body>
</html>
